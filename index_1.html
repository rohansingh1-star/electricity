<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Electricity">
<title>Electricity Revamp Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: a shipped fintech app mock-up for product and leadership review
   IDEA the MobiKwik app on Kairos with the electricity flow rebuilt end to end
   PICTURE the live phone itself; every screen and state is clickable
   COLOUR MBK Blue #004DEC, navy header, white cards on cool grey; green, amber, red only for bill status
   TYPE Inter for all UI text
   LAYOUT laptop: phone centred with a flow index on the left; phone: the app fills the screen */
:root{color-scheme:light dark;--page:light-dark(#E6E9F0,#0E1014);--pink:light-dark(#17191C,#E9EBF0);--pmute:light-dark(#5B6472,#9AA3B2);--pline:light-dark(#CDD3DE,#2A2F38)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--pink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px 16px}
.guide{width:320px}
.guide h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.guide p{color:var(--pmute);margin:0 0 18px;font-size:15px}
.guide ol{padding:0;margin:0;list-style:none;display:grid;gap:5px}
.guide button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:7px 12px;line-height:1.35;border-radius:12px;font-size:15px;color:var(--pink);border:1px solid var(--pline)}
.guide button b{font-weight:600}
.guide button span{display:block;font-size:12.5px;color:var(--pmute)}
.guide button:hover,.guide button:focus-visible{background:color-mix(in srgb,#004DEC 14%,transparent);outline:none}
.qr{display:flex;gap:14px;align-items:center;margin-top:14px;padding:10px;border-radius:14px;border:1px solid var(--pline)}
.qr svg{flex:none;border-radius:8px}
.qr p{margin:0;font-size:13px}
.qr b{display:block;color:var(--pink);font-size:14px}
.guide small{display:block;margin-top:10px;color:var(--pmute);font-size:13px}
.phone{position:relative;flex:none;width:390px;height:844px;max-height:calc(100svh - 48px);border-radius:46px;background:#F3F5F9;overflow:hidden;box-shadow:0 0 0 10px #15171B,0 30px 70px rgba(0,0,0,.28);color-scheme:light;color:#17191C;font-size:15px}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.sbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;background:var(--sb,#fff);color:var(--sbc,#17191C)}
#scr{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F3F5F9}
.screen.anim{animation:slide .24s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.screen.anim,.sheet,.push,.okc,.sk{animation:none!important}}
.top{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;height:56px;background:#fff;border-bottom:1px solid #E6E8EE;flex:none}
.top h2{font-size:17px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h2 small{display:block;font-size:12px;color:#6B7280;font-weight:500}
.icb{all:unset;width:44px;height:44px;display:grid;place-items:center;border-radius:22px;cursor:pointer;color:inherit}
.bc{font-size:11px;font-weight:700;color:#0A1F7A;background:#EEF2FF;padding:4px 9px;border-radius:999px;white-space:nowrap}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;padding:16px;border:1px solid #E6E8EE}
.foot{flex:none;background:#fff;border-top:1px solid #E6E8EE;padding:12px 16px 18px;display:grid;gap:8px}
.btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:#004DEC;color:#fff;font-weight:700;font-size:16px;cursor:pointer;width:100%;white-space:nowrap}
.btn.sec{background:#EEF3FF;color:#004DEC}
.btn.sm{height:38px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{background:#C7CEDB;color:#fff;cursor:not-allowed}
.btn:focus-visible,.icb:focus-visible,.link:focus-visible,.opt:focus-visible,.tile:focus-visible,.conn:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
.link{all:unset;color:#004DEC;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.due{background:#FEF3E2;color:#A3530A}.over{background:#FDECEA;color:#B42318}.ok{background:#E7F6EF;color:#0B7A55}.off{background:#EEF0F4;color:#4B5563}.new{background:#EEF2FF;color:#0A1F7A}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11.5px;flex:none;letter-spacing:.01em}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.t1{font-weight:700;font-size:15px}
.t2{color:#6B7280;font-size:13px}
.amt{font-weight:800;font-size:17px;white-space:nowrap}
.sep{height:1px;background:#EEF0F4;margin:12px 0}
.hhead{background:#0A1F7A;color:#fff;padding:10px 16px 46px}
.me{width:40px;height:40px;border-radius:20px;background:#3B5BDB;display:grid;place-items:center;font-weight:700}
.bal{font-weight:600}
.upi{font-size:12.5px;opacity:.8}
.hbody{flex:1;overflow-y:auto;margin-top:-30px;border-radius:24px 24px 0 0;background:#F3F5F9;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.tile{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:12.5px;line-height:1.25;color:#17191C;padding:4px 0;border-radius:12px}
.tile i{width:50px;height:50px;border-radius:16px;background:#EEF3FF;display:grid;place-items:center;color:#004DEC;position:relative}
.tile em{position:absolute;top:-6px;right:-10px;font-style:normal;font-size:9.5px;font-weight:800;background:#004DEC;color:#fff;border-radius:6px;padding:1px 5px}
.qf{grid-column:1/-1;display:flex;justify-content:space-between;background:#F3F5F9;border-radius:10px;padding:8px 12px;font-size:13px;color:#38424F;margin-top:6px}
.bills .brow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF0F4}
.bnav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:#fff;border-top:1px solid #E6E8EE;padding:6px 6px 14px;font-size:11.5px;color:#6B7280;text-align:center}
.bnav div{display:grid;justify-items:center;gap:2px}
.bnav .on{color:#004DEC;font-weight:600}
.fab{width:56px;height:56px;border-radius:28px;background:#004DEC;color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 14px rgba(0,77,236,.35)}
.health{background:#FFF7E8;border:1px solid #F6DDB0;color:#7A4B07;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.conn{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:#fff;border:1px solid #E6E8EE;border-radius:16px;padding:14px}
.conn .act{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.add{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center;border:1.5px dashed #B9C6E8;color:#004DEC;font-weight:700;border-radius:16px;height:56px}
.hero{text-align:center;padding:8px 0 4px}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.kv span:first-child{color:#6B7280}
.kv span:last-child{font-weight:600;text-align:right;white-space:nowrap}
.offer{display:flex;gap:10px;align-items:center;background:#E7F6EF;border-radius:12px;padding:10px 12px}
.offer .t1{color:#0B5E43;font-size:14px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%}
.card.pick{background:#fff;border:1px solid #E6E8EE;border-radius:16px;padding:16px;position:relative}
.mi{width:42px;height:42px;border-radius:12px;background:#F3F5F9;display:grid;place-items:center;color:#38424F;flex:none}
.scrim{position:absolute;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 22px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:#D5DAE3;margin:0 auto 12px}
.sheet h3{margin:4px 0 6px;font-size:19px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid #E6E8EE;border-radius:12px;margin-top:8px}
.opt.on{border-color:#004DEC;background:#F4F7FF}
.dot{width:20px;height:20px;border-radius:10px;border:2px solid #AEB6C6;flex:none;display:grid;place-items:center}
.opt.on .dot{border-color:#004DEC}
.opt.on .dot::after{content:"";width:10px;height:10px;border-radius:5px;background:#004DEC}
.tg{all:unset;cursor:pointer;width:46px;height:28px;border-radius:14px;background:#C7CEDB;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.tg.on{background:#004DEC}
.tg.on::after{left:21px}
.tg:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
.tag{font-size:10.5px;font-weight:700;background:#EEF2FF;color:#0A1F7A;padding:2px 6px;border-radius:6px;vertical-align:middle;white-space:nowrap}
.push{position:absolute;top:50px;left:10px;right:10px;z-index:30;background:rgba(255,255,255,.97);border-radius:18px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.22);animation:drop .3s ease-out;cursor:pointer;display:flex;gap:10px}
.push .lg{width:36px;height:36px;border-radius:9px;background:#004DEC;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#17191C;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;white-space:nowrap}
.proc{position:absolute;inset:0;z-index:35;background:rgba(15,20,35,.55);display:grid;place-items:center}
.proc .card{width:260px;text-align:center}
.spin{width:44px;height:44px;border-radius:22px;border:4px solid #DCE4FB;border-top-color:#004DEC;margin:6px auto 12px;animation:spin .8s linear infinite}
.okhead{background:#0B7A55;color:#fff;text-align:center;padding:22px 16px 26px}
.okc{width:64px;height:64px;border-radius:32px;background:#fff;color:#0B7A55;display:grid;place-items:center;margin:0 auto 10px;animation:pop .45s ease-out}
.okhead .big{font-size:32px;font-weight:800;line-height:1.1}
.steps{display:grid;gap:0}
.st{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.st:last-child{padding-bottom:0}
.st:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#DDE3EC}
.st b{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;flex:none;background:#0B7A55;color:#fff}
.st b.w{background:#fff;border:2px solid #AEB6C6}
.st b.w::after{content:"";width:8px;height:8px;border-radius:4px;background:#AEB6C6}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F4 0,#F7F8FA 40%,#EEF0F4 80%) 0 0/200% 100%;animation:shimmer 1.2s linear infinite}
.inp{display:flex;align-items:center;gap:8px;border:1.5px solid #CBD2DE;border-radius:12px;padding:0 14px;height:54px;background:#fff}
.inp:focus-within{border-color:#004DEC}
.inp input{all:unset;flex:1;font-size:18px;font-weight:600;letter-spacing:.04em;height:100%}
.inp input::placeholder{color:#A0A8B8;font-weight:500;letter-spacing:0}
.srch input{font-size:16px;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cp{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid #CBD2DE;font-size:14px;font-weight:600;color:#38424F}
.cp.on{background:#004DEC;border-color:#004DEC;color:#fff}
.cp:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
.bill{border:1px solid #D9DEE7;border-radius:10px;padding:12px;font-size:12px;color:#38424F;background:#FBFBF8;position:relative}
.bill .ln{height:7px;border-radius:4px;background:#E3E6EC;margin:6px 0}
.hl{border:2px solid #004DEC;background:#EEF3FF;border-radius:8px;padding:6px 8px;font-weight:700;color:#0A1F7A;display:flex;justify-content:space-between}
.cam{flex:1;background:#101317;position:relative;display:grid;place-items:center;overflow:hidden}
.frame{width:78%;aspect-ratio:3/4;position:relative}
.frame i{position:absolute;width:34px;height:34px;border:4px solid #fff}
.frame .a{top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame .b{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame .c{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame .d{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.paper{position:absolute;inset:10%;background:#F4F1E8;border-radius:6px;transform:rotate(-3deg);padding:14px;opacity:.92}
.found{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:16px;padding:14px;animation:up .25s ease-out}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:90px;margin-top:10px}
.bars div{display:grid;gap:4px;justify-items:center;font-size:11.5px;color:#6B7280;height:100%;align-content:end}
.bars span{width:100%;border-radius:6px 6px 2px 2px;background:#C9D6FA}
.bars div:last-child span{background:#004DEC}
.meter{height:10px;border-radius:5px;background:#EEF0F4;overflow:hidden;margin:10px 0 6px}
.meter span{display:block;height:100%;background:#D92D20;border-radius:5px}
input[type=range]{width:100%;accent-color:#004DEC;height:32px}
.note{font-size:12.5px;color:#6B7280}
@media (max-width:899px){.guide{display:none}}
@media (max-width:600px){.wrap{padding:0;height:100%}.phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}.sbar{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="guide">
    <h1>Electricity, rebuilt</h1>
    <p>Clickable prototype of the revamp. Pick a flow, or tap around like the real app.</p>
    <ol>
      <li><button data-a="flow" data-v="push"><b>Bills before you ask</b><span>Push and Home card, pay in 2 taps</span></button></li>
      <li><button data-a="flow" data-v="landing"><b>Connections with status</b><span>Every bill state, no tapping to find out</span></button></li>
      <li><button data-a="flow" data-v="review"><b>One-screen Review &amp; Pay</b><span>Offer applied, method shown</span></button></li>
      <li><button data-a="flow" data-v="nodue"><b>No bill due</b><span>Last paid, next bill, Autopay</span></button></li>
      <li><button data-a="flow" data-v="offline"><b>Board offline</b><span>Notify me, Pay when back</span></button></li>
      <li><button data-a="flow" data-v="prepaid"><b>Prepaid smart meter</b><span>Balance, days left, auto top-up</span></button></li>
      <li><button data-a="flow" data-v="new"><b>Find my bill (new user)</b><span>SMS, boards near you, typed with help</span></button></li>
      <li><button data-a="flow" data-v="scan"><b>Scan your bill</b><span>Camera or PDF fills the details</span></button></li>

function hint(n, b){ if (!n) return b.len ? `${b.len} digits` : 'Numbers only'; if (valid(n, b)) return 'Looks right'; return b.len ? `${n.length} of ${b.len} digits` : 'Keep going'; }

const sheets = {
methods(){ return `<h3>Pay with</h3>${methods.map((m, i) => `<button class="opt ${S.method === i ? 'on' : ''}" data-a="method" data-v="${i}"><span class="mi">${I[m.i]}</span><span class="grow"><span class="t1" style="display:block">${m.t}</span><span class="t2">${m.s}</span></span><span class="dot"></span></button>`).join('')}<div class="note" style="margin-top:12px">Wallet money loaded from a credit card cannot pay bills. We only show this rule when it applies.</div>`; },
offers(){ return `<h3>Offers for this bill</h3><div class="t2">We pick the best one for you. Change it if you like.</div>${offers.map((o, i) => `<button class="opt ${S.offer === i ? 'on' : ''}" data-a="offer" data-v="${i}"><span class="grow"><span class="t1" style="display:block">${o.t}</span><span class="t2">${o.s}</span></span><span class="dot"></span></button>`).join('')}<div class="inp srch" style="margin-top:12px"><input placeholder="Have a promo code?" aria-label="Promo code"></div>`; },
autopay(){ const c = C(S.sel) || C('home'); const w = ['When the bill arrives','2 days before the due date','On the due date'];
  return `<h3>Autopay for ${esc(c.nick)} · ${c.board}</h3><div class="t2">We pay each new bill for you. You stay in control.</div>
  <div class="t1" style="margin-top:14px">When to pay</div>${w.map((x, i) => `<button class="opt ${S.apWhen === i ? 'on' : ''}" data-a="apwhen" data-v="${i}"><span class="grow t1" style="font-weight:600">${x}</span><span class="dot"></span></button>`).join('')}
  <div class="row" style="margin-top:16px"><label for="apmax" class="t1 grow">Pay up to</label><span class="amt" id="apv">${inr(S.apMax)}</span></div>
  <input type="range" id="apmax" min="1000" max="15000" step="500" value="${S.apMax}">
  <div class="note">Bills above this need your approval. Up to ₹15,000 runs without a UPI PIN.</div>
  <div class="card row" style="margin-top:12px;padding:12px"><span class="mi">${I.upi}</span><div class="grow"><div class="t1">HDFC Bank UPI</div><div class="t2">••4821 · UPI AutoPay mandate</div></div></div>
  <div class="note" style="margin:10px 0 14px">A notice comes a day before every debit, with a Skip this month option. Pause or cancel any time.</div>
  <button class="btn" data-a="apon">Turn on with UPI PIN</button>`; },
nodue(){ const c = C(S.sel); return `<div style="text-align:center"><div class="okc" style="background:#E7F6EF;animation:none">${I.bigcheck}</div><h3>No bill due for ${esc(c.nick)}</h3><div class="t2">${c.board} · ${mask(c.num)}</div></div>
  <div class="card" style="margin-top:14px"><div class="kv"><span>Last paid</span><span>${inr(c.paidAmt)} ${c.paidOn === 'today' ? 'today' : 'on ' + c.paidOn}</span></div><div class="kv"><span>Paid via</span><span>${c.via}</span></div><div class="kv"><span>Next bill</span><span>${c.next}</span></div></div>
  <div class="note" style="margin:10px 0 14px">We'll remind you as soon as the next bill is out.</div>
  ${S.autopay[c.id] ? `<div class="card row" style="margin-bottom:10px"><span class="chip ok">${I.check} Autopay on</span></div>` : `<button class="btn" data-a="sheet" data-v="autopay">Set up Autopay</button>`}
  <button class="btn sec" style="margin-top:8px" data-a="advance">Pay in advance</button>`; },
offline(){ const c = C(S.sel); return `<h3>${c.board} is not taking payments right now</h3><div class="t2">This is on the board's side and affects every app. Boards usually come back within a few hours.</div>
  <div class="card" style="margin-top:14px"><div class="kv"><span>Connection</span><span>${esc(c.nick)} · ${mask(c.num)}</span></div><div class="kv"><span>Last known bill</span><span>${inr(c.lastAmt)}, due ${c.lastDue}</span></div></div>
  <div class="row" style="margin-top:14px"><div class="grow"><div class="t1">Notify me when it's back</div><div class="t2">Push with a link straight to pay</div></div><button class="tg ${S.notify[c.id] ? 'on' : ''}" data-a="notify" role="switch" aria-checked="${!!S.notify[c.id]}" aria-label="Notify me"></button></div>
  <div class="sep"></div>
  <div class="row"><div class="grow"><div class="t1">Pay automatically when back <span class="tag">Phase 2</span></div><div class="t2">We check the bill first, then pay up to ${inr(c.lastAmt + 200)}</div></div><button class="tg ${S.payBack[c.id] ? 'on' : ''}" data-a="payback" role="switch" aria-checked="${!!S.payBack[c.id]}" aria-label="Pay automatically when back"></button></div>
  <button class="btn" style="margin-top:18px" data-a="close">Done</button>`; },
help(){ const b = B(S.draft.board); return `<h3>Where to find your ${b.label}</h3><div class="t2">Top right of your ${b.code} bill, just under the bill date.</div>
  <div class="bill" style="margin-top:14px"><div style="font-weight:800;color:${b.col}">${esc(b.name.toUpperCase())}</div><div class="ln" style="width:60%"></div><div class="row" style="margin:8px 0"><div class="grow"><div class="ln"></div><div class="ln" style="width:70%"></div></div><div class="hl" style="flex:0 0 58%"><span>${b.label}</span><span>21•• •••• •058</span></div></div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:50%"></div></div>
  <div class="t1" style="margin-top:14px">Other places to look</div><div class="t2">The SMS from ${b.code} when a bill is generated, the ${b.code} app, or an old payment receipt.</div>
  <button class="btn" style="margin-top:16px" data-a="close">Got it</button>`; },
receipt(){ const L = S.last; const rows = [['Board', B(L.board).name], ['Consumer', L.cname], [B(L.board).label, fmt(L.num)], ['Amount', inr(L.amount)], ['Paid with', L.method], ['Date and time', '26 Nov 2026, ' + L.time], ['Bharat Connect ref', L.ref], ['MobiKwik txn ID', L.txn]];
  return `<h3>Payment receipt</h3>${rows.map(r => `<div class="kv"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}
  <div class="note" style="margin:10px 0 14px">A PDF copy is also sent to your email and WhatsApp.</div><button class="btn sec" data-a="copy" data-v="${esc(rows.map(r => r[0] + ': ' + r[1]).join('\n'))}">Copy details</button>`; }
};

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function render(){
  const cur = S.stack.at(-1);
  const scr = $('#scr');
  scr.innerHTML = screens[cur]();
  const el = scr.firstElementChild;
  if (S.lastScreen !== cur) el.classList.add('anim');
  S.lastScreen = cur;
  const sb = $('#sbar'), cs = getComputedStyle(el);
  sb.style.setProperty('--sb', cur === 'home' ? '#0A1F7A' : (cs.getPropertyValue('--sb').trim() || '#fff'));
  sb.style.setProperty('--sbc', ['home', 'success', 'scan'].includes(cur) ? '#fff' : '#17191C');
  layer();
  if (cur === 'home' && !S.pushed) { S.pushed = true; later(showPush, 1100); }
}
function layer(){
  const L = $('#layer');
  let h = '';
  if (S.sheet) h += `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheets[S.sheet]()}</div></div>`;
  if (S.proc) h += `<div class="proc"><div class="card"><div class="spin"></div><div class="t1">${S.proc}</div><div class="t2">Please keep the app open</div></div></div>`;
  if (S.push) h += `<div class="push" data-a="pushtap" role="button" tabindex="0"><div class="lg">M</div><div class="grow"><div class="row"><b class="grow" style="font-size:14px">MobiKwik</b><span class="t2">now</span></div><div style="font-size:14px">Your JVVNL bill is here: ₹1,240, due 29 Nov</div><div class="t2">Tap to pay in 2 taps</div></div></div>`;
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  L.innerHTML = h;
}
function showPush(){ if (S.stack.at(-1) !== 'home') return; S.push = true; layer(); later(() => { S.push = false; layer(); }, 7000); }
function toast(t){ S.toast = t; layer(); later(() => { S.toast = null; layer(); }, 2400); }
function go(s){ S.stack.push(s); S.sheet = null; render(); }
function reset(stack){ timers.forEach(clearTimeout); timers = []; S.stack = stack; S.sheet = null; S.proc = null; S.push = false; S.toast = null; S.scanned = false; render(); }
function startFetch(){ go('fetching'); later(() => {
  const b = B(S.draft.board);
  S.newc = {id:'new', nick:S.draft.nick, board:b.code, num:S.draft.num, name:'ANITA SHARMA', state:'due', amount:1680, due:'4 Dec', dueIn:8, billDate:'19 Nov', period:'19 Oct to 18 Nov', units:286, next:'around 3 Jan', parts:[['Energy charges',1342],['Fixed charges',150],['Electricity duty',128],['Other charges',60]]};
  S.sel = 'new'; S.offer = 0; S.details = false; S.stack[S.stack.length - 1] = 'review'; render(); }, 1800); }
function payNow(prepaid){
  const c = prepaid ? C('shop') : C(S.sel), o = offers[S.offer], amount = prepaid ? S.recharge : c.amount - o.off;
  S.proc = `Paying ${inr(amount)} to ${c.board}`; layer();
  later(() => {
    const t = new Date().toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'});
    const id = prepaid ? 'shop' : S.sel;
    S.last = {id:id === 'new' ? (S.draft.nick || 'new').toLowerCase() + '-new' : id, nick:prepaid ? c.nick : (id === 'new' ? S.draft.nick : c.nick), board:c.board, num:c.num, cname:c.name, amount, cb:prepaid ? 0 : o.cb, method:methods[S.method].t, time:t, ref:'CC01' + String(Date.now()).slice(-9), txn:'MK' + String(Date.now()).slice(-10), next:c.next, prepaid, confirmed:false};
    if (prepaid) c.balance += amount;
    else if (id === 'new') { const n = Object.assign({}, c, {id:S.last.id, nick:S.draft.nick, state:'paid', paidAmt:amount, paidOn:'today', via:'MobiKwik'}); conns.splice(1, 0, n); S.newc = null; S.sel = n.id; }
    else Object.assign(c, {state:'paid', paidAmt:amount, paidOn:'today', via:'MobiKwik'});
    S.proc = null; S.sheet = null; S.stack.push('success'); render();
    later(() => { if (S.last) { S.last.confirmed = true; if (S.stack.at(-1) === 'success') render(); } }, 2600);
  }, 1600);
}
function act(a, v){
  if (a === 'back') { if (S.stack.length > 1) { S.stack.pop(); S.sheet = null; S.scanned = false; render(); } return; }
  if (a === 'go') { if (v === 'scan') S.scanned = false; go(v); if (v === 'scan') later(() => { S.scanned = true; if (S.stack.at(-1) === 'scan') render(); }, 1500); return; }
  if (a === 'toast') return toast(v);
  if (a === 'pay') { S.sel = v; S.offer = 0; S.details = false; S.push = false; go('review'); return; }
  if (a === 'pushtap') { S.push = false; act('pay', 'home'); return; }
  if (a === 'conn') { const c = C(v); S.sel = v;
    if (c.state === 'due' || c.state === 'over') return act('pay', v);
    if (c.state === 'prepaid') return go('prepaid');
    S.sheet = c.state === 'paid' ? 'nodue' : 'offline'; layer(); return; }
  if (a === 'sheet') { if (v === 'autopay' && S.stack.at(-1) === 'success' && S.last) S.sel = S.last.id; S.sheet = v; layer(); return; }
  if (a === 'close' || a === 'scrim') { S.sheet = null; layer(); return; }
  if (a === 'details') { S.details = !S.details; render(); return; }
  if (a === 'method') { S.method = +v; S.sheet = null; render(); return; }
  if (a === 'offer') { S.offer = +v; S.sheet = null; render(); return; }
  if (a === 'confirm') return payNow(false);
  if (a === 'recharge') return payNow(true);
  if (a === 'apwhen') { S.apWhen = +v; layer(); return; }
  if (a === 'apon') { const id = S.sel === 'new' ? 'new' : S.sel; S.autopay[id] = true; S.sheet = null; render(); toast('Autopay is on'); return; }
  if (a === 'notify') { S.notify[S.sel] = !S.notify[S.sel]; layer(); render(); return; }
  if (a === 'payback') { S.payBack[S.sel] = !S.payBack[S.sel]; layer(); return; }
  if (a === 'amt') { S.recharge = +v; render(); return; }
  if (a === 'autotop') { S.autoTop = !S.autoTop; render(); if (S.autoTop) toast('Auto top-up is on'); return; }
  if (a === 'advance') { S.sheet = null; layer(); toast('Pay in advance: Phase 2, for boards that allow it'); return; }
  if (a === 'sms') { S.draft = {board:'JVVNL', num:'210412037730', nick:'Home'}; startFetch(); return; }
  if (a === 'board') { S.draft = {board:v, num:'', nick:'Home'}; go('number'); return; }
  if (a === 'nick') { S.draft.nick = v; if (S.newc && S.stack.at(-1) === 'review') S.newc.nick = v; render(); return; }
  if (a === 'fill') { const b = B(S.draft.board); S.draft.num = b.len ? '210412037730'.slice(0, b.len) : '1003510248'; render(); return; }
  if (a === 'getbill') { if (valid(S.draft.num, B(S.draft.board))) startFetch(); return; }
  if (a === 'scanuse') { S.draft = {board:'JVVNL', num:'210412037730', nick:'Home'}; S.scanned = false; startFetch(); return; }
  if (a === 'copy') { try { navigator.clipboard.writeText(v).then(() => toast('Copied'), () => toast('Copy is blocked here')); } catch (e) { toast('Copy is blocked here'); } return; }
  if (a === 'done') { S.last = null; reset(['home', 'landing']); return; }
  if (a === 'flow') {
    if (v === 'push') { S.pushed = false; reset(['home']); return; }
    if (v === 'landing') return reset(['home', 'landing']);
    if (v === 'review') { S.sel = 'home'; if (C('home').state !== 'due') Object.assign(C('home'), {state:'due'}); return reset(['home', 'landing', 'review']); }
    if (v === 'nodue') { reset(['home', 'landing']); S.sel = 'office'; S.sheet = 'nodue'; layer(); return; }
    if (v === 'offline') { reset(['home', 'landing']); S.sel = 'flat'; S.sheet = 'offline'; layer(); return; }
    if (v === 'prepaid') return reset(['home', 'landing', 'prepaid']);
    if (v === 'new') return reset(['home', 'landing', 'add']);
    if (v === 'scan') { reset(['home', 'landing', 'add']); act('go', 'scan'); return; }
    if (v === 'autopay') { S.sel = 'home'; if (C('home').state !== 'due') Object.assign(C('home'), {state:'due'}); reset(['home', 'landing', 'review']); S.sheet = 'autopay'; layer(); return; }
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  if (t.dataset.a === 'scrim' && e.target !== t) return;
  act(t.dataset.a, t.dataset.v);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; layer(); } if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'pushtap') act('pushtap'); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'knum') {
    const b = B(S.draft.board), n = t.value.replace(/\D/g, '').slice(0, b.len || 14);
    S.draft.num = n; t.value = fmt(n);
    const ok = valid(n, b);
    $('#khint').textContent = hint(n, b); $('#kok').innerHTML = ok ? I.check : ''; $('#getb').disabled = !ok;
  }
  if (t.id === 'bq') { S.q = t.value; $('#blist').innerHTML = boardList(); }
  if (t.id === 'apmax') { S.apMax = +t.value; $('#apv').textContent = inr(S.apMax); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'upl' && e.target.files && e.target.files.length) { toast('Reading your bill'); later(() => { S.draft = {board:'JVVNL', num:'210412037730', nick:'Home'}; startFetch(); }, 1200); }
});
render();
}
</script>
</body>
</html>
